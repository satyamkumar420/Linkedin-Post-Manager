[project]
name = "linkedin-post-manager"
version = "0.1.0"
description = "Production-ready LinkedIn Post Manager MCP 2.0 Server for drafting, scheduling, formatting, and publishing posts"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Satyam Kumar", email = "satyamkumar2460@gmail.com" }
]
dependencies = [
    "mcp>=2.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.4",
    "pillow>=10.0.0",
]

[project.scripts]
linkedin-post-manager = "linkedin_post_manager.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
