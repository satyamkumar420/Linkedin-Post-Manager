<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B19" />
      <stop offset="40%" stop-color="#0B1528" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00A0DC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.2" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Developer Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="80" r="180" fill="#0A66C2" opacity="0.25" filter="url(#blur-glow)" />
  <circle cx="1050" cy="340" r="200" fill="#6366F1" opacity="0.2" filter="url(#blur-glow)" />
  <circle cx="600" cy="210" r="140" fill="#00D2FF" opacity="0.15" filter="url(#blur-glow)" />

  <!-- Geometric Accent Lines -->
  <path d="M 0 100 Q 300 40 600 120 T 1200 80" fill="none" stroke="url(#primary-glow)" stroke-width="1.2" opacity="0.35" />
  <path d="M 0 320 Q 400 380 800 290 T 1200 340" fill="none" stroke="url(#accent-glow)" stroke-width="1.2" opacity="0.3" />

  <!-- Center Presentation Container (Glassmorphism card) -->
  <rect x="70" y="45" width="1060" height="330" rx="20" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" filter="url(#card-shadow)" />

  <!-- Top Status Pill / Header -->
  <g transform="translate(110, 75)">
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#0A66C2" fill-opacity="0.2" stroke="#00A0DC" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">
      MODEL CONTEXT PROTOCOL 2.0
    </text>
  </g>

  <!-- Version & Safety Badge -->
  <g transform="translate(860, 75)">
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <!-- Shield Icon -->
    <path d="M 22 9 L 32 13 V 20 C 32 25 22 29 22 29 C 22 29 12 25 12 20 V 13 Z" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linejoin="round" />
    <text x="40" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">
      100% Safe Official REST API
    </text>
  </g>

  <!-- Main Brand Icon: LinkedIn + MCP Core Visual -->
  <g transform="translate(110, 140)">
    <!-- Icon Container Box -->
    <rect x="0" y="0" width="90" height="90" rx="22" fill="#0A66C2" />
    <rect x="0" y="0" width="90" height="90" rx="22" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- LinkedIn 'in' typography -->
    <text x="45" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" fill="#FFFFFF" text-anchor="middle">in</text>
    
    <!-- Orbiting Tech Dot -->
    <circle cx="85" cy="8" r="8" fill="#38BDF8">
      <animate attributeName="r" values="7;9;7" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Main Title & Hierarchy -->
  <g transform="translate(225, 168)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      LinkedIn Post Manager
      <tspan fill="#38BDF8"> MCP</tspan>
    </text>
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
      Production-ready AI assistant server for drafting, scheduling, optimizing &amp; publishing posts
    </text>
  </g>

  <!-- Bottom Feature Badges / Highlights -->
  <g transform="translate(110, 275)">
    <!-- Badge 1: Drafts & Database -->
    <g transform="translate(0, 0)">
      <rect width="180" height="52" rx="12" fill="url(#badge-grad)" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Local SQLite</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Drafts &amp; Post Queue</text>
    </g>

    <!-- Badge 2: Scheduler -->
    <g transform="translate(195, 0)">
      <rect width="180" height="52" rx="12" fill="url(#badge-grad)" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Auto Scheduler</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Background Dispatch</text>
    </g>

    <!-- Badge 3: AI Optimizer -->
    <g transform="translate(390, 0)">
      <rect width="180" height="52" rx="12" fill="url(#badge-grad)" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Hook &amp; CTA AI</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Readability &amp; Hashtags</text>
    </g>

    <!-- Badge 4: Media Uploads -->
    <g transform="translate(585, 0)">
      <rect width="180" height="52" rx="12" fill="url(#badge-grad)" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Media Assets</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Image &amp; Banner Posts</text>
    </g>

    <!-- Badge 5: Python 3.10+ -->
    <g transform="translate(780, 0)">
      <rect width="200" height="52" rx="12" fill="url(#badge-grad)" stroke="#1E293B" stroke-width="1" />
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">MCPServer (v2)</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">Python 3.10+ Native</text>
    </g>
  </g>
</svg>
